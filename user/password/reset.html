<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Réinitialisation de mot de passe ARKOS.">
    <meta name="theme-color" content="#07110B">
    <title>ARKOS — Réinitialisation</title>
    <link rel="shortcut icon" href="../../storage/img/icone.png">
    <link href="../../assets/vendor/bootstrap-icons/bootstrap-icons19c1.css" rel="stylesheet">
    <link href="../../assets/vendor/bootstrap/css/bootstrap.min19c1.css" rel="stylesheet">
    <link href="../../assets/css/base19c1.css" rel="stylesheet">
    <link href="../../assets/themes/rune/css/style19c1.css" rel="stylesheet">
    <script src="../../assets/vendor/bootstrap/js/bootstrap.bundle.min19c1.js" defer></script>
    <script src="../../assets/vendor/axios/axios.min19c1.js" defer></script>
    <script src="../../assets/js/script19c1.js" defer></script>
    <script src="../../assets/themes/rune/js/app19c1.js" defer></script>
</head>
<body data-bs-theme="dark">
<div id="app">
    <nav class="navbar navbar-expand-lg storycraft-nav fixed-top"><div class="container"></div></nav>
    <main class="content container" style="padding-top: 8rem;">
        <div id="status-message" class="mb-4"></div>
        <div class="auth-shell">
            <section class="auth-side glass-card">
                <span class="section-kicker">Sécurité</span>
                <h1 class="auth-title">Récupère l'accès à <span class="gradient">ARKOS</span></h1>
                <p class="auth-subtitle">Le backend est prêt à gérer la demande de réinitialisation, l'historique de sécurité et des extensions comme la 2FA ou les passkeys.</p>
            </section>
            <section class="auth-card glass-card">
                <h2 class="section-title mb-3">Mot de passe oublié</h2>
                <form data-auth-form data-endpoint="/api/auth/forgot-password">
                    <div class="mb-4">
                        <label class="form-label" for="email">Adresse email</label>
                        <input id="email" type="email" class="form-control" name="email" placeholder="toi@exemple.fr" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Envoyer le lien</button>
                        <a href="../login.html" class="btn btn-outline-primary">Retour à la connexion</a>
                    </div>
                </form>
            </section>
        </div>
    </main>
</div>
<footer class="site-footer"></footer>
</body>
</html>
